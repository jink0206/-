<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html{overflow:hidden;width:1080px}
body{height:1080px;background:linear-gradient(160deg,var(--navy) 0%,var(--navy2) 100%);color:#fff;position:relative;overflow:hidden}
.badge{position:absolute;left:80px;top:80px;background:var(--yellow);color:var(--navy);font-weight:900;font-size:38px;padding:14px 30px;border-radius:999px}
h1{position:absolute;left:80px;top:180px;font-size:100px;line-height:1.18;font-weight:900;letter-spacing:-3px}
h1 span{color:var(--yellow)}
.sub{position:absolute;left:80px;top:575px;font-size:48px;font-weight:700;line-height:1.4}
.chips{position:absolute;left:80px;top:745px;width:920px;display:flex;flex-wrap:wrap;gap:16px}
.chips b{font-weight:700;font-size:34px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.35);padding:10px 24px;border-radius:999px}
.foot{position:absolute;left:80px;bottom:70px;font-size:30px;color:#c9d3ea;font-weight:400}
.ticket{position:absolute;right:30px;top:70px;width:300px;height:150px;background:var(--yellow);border-radius:20px;transform:rotate(12deg);opacity:.95}
.ticket:before,.ticket:after{content:"";position:absolute;top:50%;width:44px;height:44px;margin-top:-22px;border-radius:50%;background:var(--navy2)}
.ticket:before{left:-22px}.ticket:after{right:-22px}
.ticket i{position:absolute;left:60px;top:38px;font-style:normal;color:var(--navy);font-weight:900;font-size:40px;line-height:1.3}
</style>
<div class="ticket"><i>수험표<br>제시</i></div>

<div class="chips"><b>롯데월드</b><b>에버랜드</b><b>대전오월드</b><b>롯데시네마</b><b>이스타항공</b><b>씨라이프</b></div>
